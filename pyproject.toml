[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-volatility"
version = "0.1.0"
description = "Analysis pipeline for 'Signatures of Hebbian plasticity in the nanoscale morphodynamics of cortical spines'"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohammadreza Soltanipour" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "dynesty>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
